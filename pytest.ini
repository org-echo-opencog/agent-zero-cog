[pytest]
# Pytest configuration for Agent Zero

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    e2e: End-to-end tests (full system tests)
    slow: Slow tests that take more than 5 seconds
    opencog: Tests requiring OpenCog installation
    api: API endpoint tests
    tools: Tool-specific tests
    helpers: Helper module tests
    models: Model-related tests
    agent: Agent core functionality tests

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Timeout for individual tests (in seconds)
timeout = 300

# Async mode for pytest-asyncio
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = python,agent,models,initialize
omit =
    tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
