name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.7.0"

jobs:
  # =============================================================================
  # Linting and Code Quality
  # =============================================================================
  TESTING: "1"
  LITELLM_LOG: "ERROR"
  LOG_LEVEL: "ERROR"

jobs:
  # ============================================================================
  # Linting and Code Quality
  # ============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install linting tools
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff linter
        run: |
          ruff check python/ --output-format=github || true
        continue-on-error: true

      - name: Check code formatting with Black
        run: |
          black --check --diff python/ || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff python/ || true
        continue-on-error: true

      - name: Run MyPy type checking
        run: |
          mypy python/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  # =============================================================================
  # Unit Tests
  # =============================================================================
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
        run: ruff check . --output-format=github || true
        continue-on-error: true

      - name: Check code formatting with Black
        run: black --check --diff . || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: isort --check-only --diff . || true
        continue-on-error: true

  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout pytest-xdist

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=python \
            --cov=agent \
            --cov=models \
            --cov=initialize \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            -x \
            --timeout=300 \
            -n auto \
            || true
        env:
          TESTING: "true"
          API_KEY_OPENAI: "sk-test-key"
          API_KEY_ANTHROPIC: "test-anthropic-key"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================================
  # Integration Tests
  # =============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-xdist
          pip install -r requirements.txt || true
        continue-on-error: true

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -m "unit or not integration and not e2e and not slow" \
            --ignore=tests/test_e2e.py \
            --timeout=60 \
            --cov=python \
            --cov=agent \
            --cov=models \
            --cov-report=xml \
            --cov-report=term-missing \
            -x \
            || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration" \
            --timeout=300 \
            || true
        env:
          TESTING: "true"
          API_KEY_OPENAI: "sk-test-key"
          API_KEY_ANTHROPIC: "test-anthropic-key"

  # =============================================================================
  # E2E Tests
  # =============================================================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test-integration
          pip install pytest pytest-asyncio pytest-timeout
          pip install -r requirements.txt || true
        continue-on-error: true

      - name: Run integration tests
        run: |
          python -m pytest tests/test_tools_integration.py \
            -v \
            --tb=short \
            --timeout=120 \
            || true
        continue-on-error: true

  # ============================================================================
  # E2E Tests
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ \
            -v \
            --tb=short \
            -m "e2e" \
            --timeout=600 \
            || true
        env:
          TESTING: "true"
          API_KEY_OPENAI: "sk-test-key"
          API_KEY_ANTHROPIC: "test-anthropic-key"

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
          pip install pytest pytest-asyncio pytest-timeout
          pip install -r requirements.txt || true
        continue-on-error: true

      - name: Run E2E tests
        run: |
          python -m pytest tests/test_e2e.py \
            -v \
            --tb=short \
            --timeout=300 \
            || true
        continue-on-error: true

  # ============================================================================
  # OpenCog Integration Tests
  # ============================================================================
  opencog-tests:
    name: OpenCog Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security linter
        run: |
          bandit -r python/ -f json -o bandit-report.json || true
          bandit -r python/ -ll || true
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          safety check -r requirements.txt --output json > safety-report.json || true
          safety check -r requirements.txt || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
        continue-on-error: true

  # =============================================================================
  # Build Verification
  # =============================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt || true
        continue-on-error: true

      - name: Run OpenCog tests
        run: |
          python -m pytest tests/test_opencog_integration.py tests/test_opencog_settings.py \
            -v \
            --tb=short \
            || true
        continue-on-error: true

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build || true
        continue-on-error: true

      - name: Verify package
        run: |
          if [ -d "dist" ]; then
            twine check dist/* || true
          fi
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
        continue-on-error: true

  # =============================================================================
  # Docker Build Test
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r python/ agent.py models.py initialize.py \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            || true
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt || true
          safety check --full-report || true
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # ============================================================================
  # Docker Build Test
  # ============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./DockerfileLocal
          push: false
          tags: agent-zero:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # =============================================================================
  # All Tests Summary
  # =============================================================================
  tests-complete:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration, test-e2e, security, build]
      - name: Build Docker image (local)
        run: |
          docker build -f DockerfileLocal -t agent-zero-cog:test . || true
        continue-on-error: true

      - name: Build Docker image (base)
        run: |
          if [ -f docker/base/Dockerfile ]; then
            docker build -f docker/base/Dockerfile -t agent-zero-base:test docker/base/ || true
          fi
        continue-on-error: true

  # ============================================================================
  # Documentation Build
  # ============================================================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation files exist
        run: |
          echo "Checking for documentation files..."
          ls -la docs/ || echo "No docs directory"
          ls -la README.md || echo "No README.md"

      - name: Validate markdown files
        run: |
          pip install mdformat
          find . -name "*.md" -type f | head -20 | xargs mdformat --check || true
        continue-on-error: true

  # ============================================================================
  # All Tests Summary
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, e2e-tests, security, docker-build]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.test-unit.result }}"
          echo "Integration Tests: ${{ needs.test-integration.result }}"
          echo "E2E Tests: ${{ needs.test-e2e.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"

      - name: Final status
        run: |
          if [[ "${{ needs.test-unit.result }}" == "success" ]]; then
            echo "Core tests passed!"
            exit 0
          else
            echo "Some tests may have failed, check individual job logs"
            exit 0
          fi
          echo "=== CI Pipeline Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"

      - name: Set final status
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          echo "CI Pipeline completed"
