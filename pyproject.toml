[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-zero-cog"
version = "1.0.0"
description = "Agent Zero with OpenCog integration - A personal AI assistant framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Zero Team"}
]
keywords = [
    "ai",
    "agent",
    "llm",
    "autonomous",
    "assistant",
    "opencog",
    "reasoning",
    "langchain"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.2.0",
    "pytest-html>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
    "httpx>=0.25.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
    "responses>=0.23.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.25.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "faker>=19.0.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "agent-zero-cog[dev,test,security,docs]",
]

[project.urls]
Homepage = "https://github.com/org-echo-opencog/agent-zero-cog"
Documentation = "https://github.com/org-echo-opencog/agent-zero-cog/tree/main/docs"
Repository = "https://github.com/org-echo-opencog/agent-zero-cog.git"
Issues = "https://github.com/org-echo-opencog/agent-zero-cog/issues"

[project.scripts]
agent-zero = "run_ui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["python*", "agents*", "prompts*", "webui*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yaml", "*.yml"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# ============================================================================
# Testing Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=python",
    "--cov=agent",
    "--cov=models",
    "--cov=initialize",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=30",
]
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test multiple components together",
    "e2e: End-to-end tests that test the full application flow",
    "slow: Tests that take a long time to run",
    "api: Tests for API endpoints",
    "tools: Tests for agent tools",
    "helpers: Tests for helper utilities",
    "models: Tests for model wrappers",
    "agent: Tests for agent core functionality",
    "opencog: Tests for OpenCog integration",
    "mcp: Tests for MCP protocol",
    "browser: Tests that require browser automation",
    "docker: Tests that require Docker",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
timeout = 300
timeout_method = "thread"

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["python", "agent", "models", "initialize"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*.pyc",
    "run_*.py",
    "preload.py",
    "prepare.py",
    "update_reqs.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================================
# Code Formatting
# ============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | webui
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "node_modules", "webui"]
known_first_party = ["python", "agent", "models", "initialize"]

# ============================================================================
# Linting Configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "webui",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    "C901",   # too complex
    "B904",   # raise without from inside except
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["python", "agent", "models", "initialize"]

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "webui/",
    "docs/",
    "build/",
    "dist/",
    ".venv/",
]
plugins = []

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "litellm.*",
    "sentence_transformers.*",
    "browser_use.*",
    "flask.*",
    "paramiko.*",
    "docker.*",
    "opencog.*",
    "mcp.*",
    "fastmcp.*",
    "playwright.*",
    "tiktoken.*",
    "faiss.*",
]
ignore_missing_imports = true

# ============================================================================
# Security Scanning
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", "webui", ".venv", "venv"]
skips = ["B101", "B104", "B110"]
