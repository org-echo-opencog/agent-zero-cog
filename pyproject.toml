[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-zero-cog"
version = "1.0.0"
description = "Agent Zero with OpenCog integration - A personal AI assistant framework with no guardrails"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Zero Team"}
]
keywords = [
    "ai",
    "agent",
    "llm",
    "autonomous",
    "assistant",
    "opencog",
    "reasoning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "a2wsgi>=1.10.8",
    "ansio>=0.0.1",
    "browser-use>=0.5.11",
    "docker>=7.1.0",
    "duckduckgo-search>=6.1.12",
    "faiss-cpu>=1.11.0",
    "fastmcp>=2.3.4",
    "fasta2a>=0.5.0",
    "flask[async]>=3.0.3",
    "flask-basicauth>=0.2.0",
    "flaredantic>=0.1.4",
    "GitPython>=3.1.43",
    "inputimeout>=1.0.4",
    "kokoro>=0.9.2",
    "simpleeval>=1.0.3",
    "langchain-core>=0.3.49",
    "langchain-community>=0.3.19",
    "langchain-unstructured[all-docs]>=0.1.6",
    "openai-whisper>=20240930",
    "lxml_html_clean>=0.3.1",
    "markdown>=3.7",
    "mcp>=1.13.1",
    "newspaper3k>=0.2.8",
    "paramiko>=3.5.0",
    "playwright>=1.52.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.1.0",
    "pytz>=2024.2",
    "sentence-transformers>=3.0.1",
    "tiktoken>=0.8.0",
    "unstructured[all-docs]>=0.16.23",
    "unstructured-client>=0.31.0",
    "webcolors>=24.6.0",
    "nest-asyncio>=1.6.0",
    "crontab>=1.0.1",
    "litellm>=1.75.0",
    "markdownify>=1.1.0",
    "pymupdf>=1.25.3",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pathspec>=0.12.1",
    "psutil>=7.0.0",
    "soundfile>=0.13.1",
    "opencog>=5.0.3",
    "opencog-cogserver>=5.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
]

security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

all = [
    "agent-zero-cog[dev,test,security,docs]",
]

[project.urls]
Homepage = "https://github.com/org-echo-opencog/agent-zero-cog"
Documentation = "https://github.com/org-echo-opencog/agent-zero-cog/tree/main/docs"
Repository = "https://github.com/org-echo-opencog/agent-zero-cog.git"
Issues = "https://github.com/org-echo-opencog/agent-zero-cog/issues"

[project.scripts]
agent-zero = "run_ui:main"

[tool.setuptools]
packages = ["python", "python.helpers", "python.tools", "python.api", "python.extensions"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yaml", "*.yml"]

# ============================================================================
# Testing Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "slow: Slow tests that take more than 5 seconds",
    "opencog: Tests requiring OpenCog installation",
    "api: API endpoint tests",
    "tools: Tool-specific tests",
    "helpers: Helper module tests",
    "models: Model-related tests",
    "agent: Agent core functionality tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["python", "agent", "models", "initialize"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*.pyc",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Code Formatting
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | webui
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "node_modules", "webui"]
known_first_party = ["python", "agent", "models", "initialize"]

# ============================================================================
# Linting Configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "webui",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests",
    "webui",
    "docs",
]

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "opencog.*",
    "playwright.*",
    "browser_use.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "faiss.*",
]
ignore_missing_imports = true

# ============================================================================
# Bandit Security
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", "webui", ".venv", "venv"]
skips = ["B101", "B104", "B110"]
