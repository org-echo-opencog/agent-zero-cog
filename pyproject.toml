[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-zero-cog"
version = "1.0.0"
description = "Agent Zero - Personal, organic agentic framework with OpenCog integration"
readme = "docs/README.md"
description = "Agent Zero with OpenCog integration - A personal AI assistant framework with no guardrails"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Zero Team"}
]
keywords = ["ai", "agent", "llm", "langchain", "opencog", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
keywords = [
    "ai",
    "agent",
    "llm",
    "autonomous",
    "assistant",
    "opencog",
    "reasoning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

