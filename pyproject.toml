Repository = "https://github.com/org-echo-opencog/agent-zero-cog.git"
Issues = "https://github.com/org-echo-opencog/agent-zero-cog/issues"

[project.scripts]
agent-zero = "run_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*", "agents*", "prompts*", "webui*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
[tool.setuptools]
packages = ["python", "python.helpers", "python.tools", "python.api", "python.extensions"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yaml", "*.yml"]

# ============================================================================
# Testing Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=python",
    "--cov=agent",
    "--cov=models",
    "--cov=initialize",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=30",
]
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test multiple components together",
    "e2e: End-to-end tests that test the full application flow",
    "slow: Tests that take a long time to run",
    "api: Tests for API endpoints",
    "tools: Tests for agent tools",
    "helpers: Tests for helper utilities",
    "models: Tests for model wrappers",
    "agent: Tests for agent core functionality",
    "opencog: Tests for OpenCog integration",
    "mcp: Tests for MCP protocol",
    "browser: Tests that require browser automation",
    "docker: Tests that require Docker",
    "network: Tests that require network access",
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "slow: Slow tests that take more than 5 seconds",
    "opencog: Tests requiring OpenCog installation",
    "api: API endpoint tests",
    "tools: Tool-specific tests",
    "helpers: Helper module tests",
    "models: Model-related tests",
    "agent: Agent core functionality tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
timeout = 300
timeout_method = "thread"

# Coverage configuration
[tool.coverage.run]
source = ["python", "agent", "models", "initialize"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*.pyc",
    "run_*.py",
    "preload.py",
    "prepare.py",
    "update_reqs.py",
]
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["python", "agent", "models", "initialize"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*.pyc",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"

# Ruff configuration (fast Python linter)
[tool.ruff]
target-version = "py310"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict parameter
    "C901",  # too complex
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["python", "agent", "models", "initialize"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["python", "agent", "models", "initialize"]
skip = [".git", ".venv", "node_modules", "__pycache__"]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
    ".venv/",
]
plugins = []

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "litellm.*",
    "sentence_transformers.*",
    "browser_use.*",
    "flask.*",
    "paramiko.*",
    "docker.*",
    "opencog.*",
    "mcp.*",
    "fastmcp.*",
]
ignore_missing_imports = true
directory = "htmlcov"

# ============================================================================
# Code Formatting
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | webui
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "node_modules", "webui"]
known_first_party = ["python", "agent", "models", "initialize"]

# ============================================================================
# Linting Configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "webui",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests",
    "webui",
    "docs",
]

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_community.*",
    "opencog.*",
    "playwright.*",
    "browser_use.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "faiss.*",
]
ignore_missing_imports = true

# ============================================================================
# Bandit Security
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", "webui", ".venv", "venv"]
skips = ["B101", "B104", "B110"]
